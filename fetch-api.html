<html>
    <!DOCTYPE html>
    <head>
        <body>

            <h2>Student Data</h2>

            <button onclick="localData()">
                Local Student
            </button>

            <p id="result"></p>

            <script>

                async function localData(){

                    const response = 
                    await fetch(
                        "https://jsonplaceholder.typicode.com/user/1"
                    );

                    console.log(response);

                    const data = 
                    await response.json();
                    console.log(data);

                    document.getElementById("result")
                    .textContent = 
                    "Student Name : " + data.name;
                    

                }

                    
                
            </script>
        </body>
    </head>
</html>
